<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <meta name="referrer" content="no-referrer">
  <title>ゲーミングカレンダー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>ゲーミングカレンダー</h1>
      <p id="updated" class="muted"></p>
    </div>
    <div class="actions">
      <button id="btn-add" class="btn primary">＋ 追加</button>
      <button id="btn-settings" class="btn" aria-label="設定">設定</button>
    </div>
  </header>

  <section id="summary" class="summary" aria-live="polite"></section>

  <nav class="controls">
    <div class="tabs" role="tablist">
      <button class="tab" data-view="list" role="tab">リスト</button>
      <button class="tab" data-view="timeline" role="tab">タイムライン</button>
    </div>
    <div id="filters" class="chips" aria-label="ゲームで絞り込み"></div>
    <div id="cat-filters" class="chips" aria-label="種類で絞り込み"></div>
  </nav>

  <main id="main"></main>

  <dialog id="dlg-add">
    <form id="form-add" method="dialog">
      <h2>イベントを追加</h2>
      <label>ゲーム名
        <input name="game" list="game-list" required autocomplete="off" placeholder="例：ブルーアーカイブ">
        <datalist id="game-list"></datalist>
      </label>
      <label>イベント名
        <input name="title" required autocomplete="off" placeholder="例：期間限定イベント">
      </label>
      <label>種類
        <select name="cat"></select>
      </label>
      <label class="check"><input name="reward" type="checkbox" checked> ガチャ用の石がもらえる</label>
      <div class="row2">
        <label>開始（省略可）
          <input name="start" type="datetime-local">
        </label>
        <label>終了
          <input name="end" type="datetime-local" required>
        </label>
      </div>
      <p id="add-error" class="error" hidden></p>
      <div class="dlg-actions">
        <button type="button" class="btn" data-close>キャンセル</button>
        <button type="submit" class="btn primary">追加する</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-settings">
    <div class="dlg-body">
      <h2>設定</h2>

      <h3>通知</h3>
      <p class="muted">終了の3日前・1日前・3時間前にお知らせします。</p>
      <button id="btn-notify" class="btn"></button>
      <p id="notify-status" class="muted small"></p>

      <h3>Googleカレンダー連携</h3>
      <p class="muted">下のURLをGoogleカレンダーの「他のカレンダー → URLで追加」に貼ると、自動取得したイベントの終了時刻が表示されます（アプリをWeb上に公開している場合のみ有効）。</p>
      <div class="copyrow">
        <input id="ics-url" readonly>
        <button id="btn-copy" class="btn">コピー</button>
      </div>
      <p class="muted small">個別のイベントは、カードの「カレンダー」ボタンからも追加できます。</p>

      <h3>別の端末に引き継ぐ</h3>
      <p class="muted">完了チェック・非表示・手動で追加したイベント・絞り込みをファイルに書き出し、別の端末で読み込めます。読み込みは今の内容に追加する形で、この端末の内容は消えません。</p>
      <div class="rowbtns">
        <button id="btn-export" class="btn">書き出す</button>
        <button id="btn-import" class="btn">読み込む</button>
        <input id="file-import" type="file" accept="application/json,.json" hidden>
      </div>

      <h3>非表示・完了のリセット</h3>
      <div class="rowbtns">
        <button id="btn-reset-hidden" class="btn">非表示にしたイベントを戻す</button>
        <button id="btn-reset-done" class="btn">完了チェックを全て外す</button>
      </div>

      <div class="dlg-actions">
        <button type="button" class="btn primary" data-close>閉じる</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="notify-core.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
