name: Update events

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch events
        shell: pwsh
        run: ./scripts/fetch-events.ps1
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json calendar.ics
          # updatedAt changes on every run; only commit when the event list itself changed.
          if git diff --cached --quiet -I'updatedAt' -I'^DTSTAMP' ; then
            echo "No event changes."
          else
            git commit -m "Update events"
            git push
          fi
